<!DOCTYPE html>
<!--
  Source for the 1200x630 social preview images (og.png, og-guide.png).
  Re-render after editing with tools/og/render.sh.
  card.html        -> og.png        (the solver)
  card.html?guide  -> og-guide.png  (the how-to-solve guide)
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #0a0e1a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent-text: #c4b5fd;
      --blue: #2563eb;
      --red: #ef4444;
      --green: #10b981;
      --yellow: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 78% 45%, #1f2a50 0%, #0a0e1a 62%);
      color: var(--text);
      display: grid;
      grid-template-columns: 1fr 470px;
      align-items: center;
      padding: 0 80px;
    }
    .eyebrow {
      color: var(--accent-text);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    h1 {
      font-size: 84px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.02;
      margin-bottom: 28px;
    }
    p {
      color: #cbd5e1;
      font-size: 32px;
      line-height: 1.35;
      max-width: 15em;
    }
    body.guide p {
      max-width: 17em;
    }
    .url {
      position: absolute;
      left: 80px;
      bottom: 52px;
      color: var(--text-muted);
      font-size: 24px;
      font-weight: 600;
    }
    svg { width: 470px; height: auto; display: block; }
    .st { stroke: var(--bg); stroke-width: 3.5; stroke-linejoin: round; }
    .st-blue { fill: var(--blue); }
    .st-red { fill: var(--red); }
    .st-green { fill: var(--green); }
    .st-yellow { fill: var(--yellow); }
    .guide-only { display: none; }
    body.guide .solver-only { display: none; }
    body.guide .guide-only { display: block; }
  </style>
</head>
<body>
  <div>
    <div class="eyebrow solver-only">Free Pyraminx solver</div>
    <div class="eyebrow guide-only">Beginner's guide</div>
    <h1 class="solver-only">Step Pyramid</h1>
    <h1 class="guide-only">How to solve a Pyraminx</h1>
    <p class="solver-only">Colour in your scramble, then follow every turn in 3D.</p>
    <p class="guide-only">Four stages.<br>Four short move sequences.</p>
  </div>

  <svg class="solver-only" viewBox="0 0 200 184" aria-hidden="true">
    <polygon class="st st-yellow" points="100.0,14.0 70.0,66.0 130.0,66.0"/>
    <polygon class="st st-red" points="70.0,66.0 40.0,117.9 100.0,117.9"/>
    <polygon class="st st-green" points="130.0,66.0 100.0,117.9 160.0,117.9"/>
    <polygon class="st st-blue" points="70.0,66.0 130.0,66.0 100.0,117.9"/>
    <polygon class="st st-green" points="40.0,117.9 10.0,169.9 70.0,169.9"/>
    <polygon class="st st-yellow" points="100.0,117.9 70.0,169.9 130.0,169.9"/>
    <polygon class="st st-red" points="160.0,117.9 130.0,169.9 190.0,169.9"/>
    <polygon class="st st-blue" points="40.0,117.9 100.0,117.9 70.0,169.9"/>
    <polygon class="st st-blue" points="100.0,117.9 160.0,117.9 130.0,169.9"/>
  </svg>
  <svg class="guide-only" viewBox="0 0 200 184" aria-hidden="true">
    <polygon class="st st-blue" points="100.0,14.0 70.0,66.0 130.0,66.0"/>
    <polygon class="st st-blue" points="70.0,66.0 40.0,117.9 100.0,117.9"/>
    <polygon class="st st-blue" points="130.0,66.0 100.0,117.9 160.0,117.9"/>
    <polygon class="st st-blue" points="70.0,66.0 130.0,66.0 100.0,117.9"/>
    <polygon class="st st-blue" points="40.0,117.9 10.0,169.9 70.0,169.9"/>
    <polygon class="st st-blue" points="100.0,117.9 70.0,169.9 130.0,169.9"/>
    <polygon class="st st-blue" points="160.0,117.9 130.0,169.9 190.0,169.9"/>
    <polygon class="st st-blue" points="40.0,117.9 100.0,117.9 70.0,169.9"/>
    <polygon class="st st-blue" points="100.0,117.9 160.0,117.9 130.0,169.9"/>
  </svg>

  <div class="url solver-only">oliverbarwell.com/step-pyramid</div>
  <div class="url guide-only">oliverbarwell.com/step-pyramid/how-to-solve</div>
  <script>
    if (location.search.includes('guide')) document.body.classList.add('guide');
  </script>
</body>
</html>
