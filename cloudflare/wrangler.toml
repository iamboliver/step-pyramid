# Optional: deploy worker.js via the Wrangler CLI instead of pasting it into
# the dashboard. From this folder: `npx wrangler deploy`
# (requires `npx wrangler login` once, and doesn't need a Cloudflare account
# upgrade -- Workers has a free tier: 100,000 requests/day.)

name = "step-pyramid-mount"
main = "worker.js"
compatibility_date = "2024-09-01"

# Required: lets this Worker invoke the actual site Worker directly, in-
# process. A plain fetch() to its *.workers.dev URL is blocked by Cloudflare
# (Worker -> Worker fetch over workers.dev/routes on the same account isn't
# allowed without a service binding) -- see the comment in worker.js.
# `service` must match the deployed Worker's script name exactly (check with
# `npx wrangler deployments list` or the dashboard if unsure).
[[services]]
binding = "SITE"
service = "step-pyramid"

# Routes can also be set here instead of in the dashboard -- uncomment and
# fill in once the zone is confirmed proxied (orange-cloud) in Cloudflare DNS.
# One pattern, no slash before the *: an exact "oliverbarwell.com/step-pyramid"
# route (no wildcard) does not reliably match once a query string is appended
# (confirmed: worked with no query, 404'd the moment one was added, even on a
# fresh/never-cached URL) -- see cloudflare/README.md step 3.
# routes = [
#   { pattern = "oliverbarwell.com/step-pyramid*", zone_name = "oliverbarwell.com" }
# ]
